[project]
name = "novelterm"
version = "0.1.0"
description = "Read web novels in the terminal."
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
    # Python for Windows has no curses module.
    "windows-curses>=2.3; sys_platform == 'win32'",
]

[project.scripts]
novelterm = "novelterm.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
