name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --locked

      - name: Import curses and the app
        run: uv run python -c "import curses, novelterm.app; print('curses', curses.version)"

      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: make-index command
        run: uv run novelterm make-index tests/fixtures/sources --output ci-index.json --name "CI"
